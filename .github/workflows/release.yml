name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
env:
  APP: HTML5AdBuilder
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: macos-latest, name: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cai thu vien
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller
      - name: Kiem tag khop version
        shell: bash
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} khac version v$v"; exit 1; }
      - name: Test nhanh truoc khi dong goi
        run: python -m pytest -q -m "not ui"
      - name: Dong goi
        run: pyinstaller build/app.spec --noconfirm --workpath build/out --distpath dist
      - name: Smoke test ban dong goi (Windows)
        if: matrix.name == 'windows'
        run: dist/${{ env.APP }}/${{ env.APP }}.exe cli --version
      - name: Nen (Windows)
        if: matrix.name == 'windows'
        run: Compress-Archive -Path dist/${{ env.APP }}/* -DestinationPath ${{ env.APP }}-windows.zip
      - name: Nen (macOS)
        if: matrix.name == 'macos'
        run: cd dist && ditto -c -k --keepParent ${{ env.APP }}.app ../${{ env.APP }}-macos.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP }}-${{ matrix.name }}.zip
          generate_release_notes: true
