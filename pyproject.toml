[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "html5-ad-builder"
version = "0.1.2"
description = "HTML5 Ad Builder — công cụ desktop chạy local (CLI + Web UI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pillow>=10.3",          # đo chữ, vẽ ảnh PNG, đọc bố cục từ ảnh mẫu
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.44", "ruff>=0.6"]

[project.scripts]
html5adbuilder = "html5adbuilder.__main__:main"
html5adbuilder-web = "web.server:main"

[tool.setuptools.packages.find]
include = ["html5adbuilder*", "web*"]

[tool.setuptools.package-data]
web = ["static/**/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: cần tool ngoài / chạy chậm",
  "real: dùng dữ liệu thật qua HTML5ADBUILDER_REAL_DATA (không bao giờ commit)",
  "ui: test trình duyệt Playwright",
]
